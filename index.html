     bouwen herhaaldelijk tijd en zou het team na elke deploy raken.
     BIJ ELKE DEPLOY OPHOGEN — zoek en vervang ?v=20260804e door de nieuwe datum. -->

<!-- ─── Login ────────────────────────────────────────────────── -->
<div id="loginscreen" style="display:none">
  <div class="lbox">
    <img src="assets/logo-dark.png" alt="Ploeggenoten">
    <h1>Welkom terug</h1>
    <p class="li">Log in met je Ploeggenoten-account.</p>
    <form id="loginform">
      <div class="f-row"><label for="login_email">E-mailadres</label>
        <input type="email" id="login_email" autocomplete="username" required placeholder="jij@ploeggenoten.nl"></div>
      <div class="f-row"><label for="login_pw">Wachtwoord</label>
        <input type="password" id="login_pw" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn block lg" type="submit">Inloggen</button>
      <div class="err" id="login_err"></div>
      <div style="text-align:center;margin-top:6px"><button type="button" class="lnk" id="login_reset">Wachtwoord vergeten?</button></div>
    </form>
  </div>
</div>

<!-- ─── App ──────────────────────────────────────────────────── -->
<div id="app">
  <nav class="side">
    <div class="brand">
      <img src="assets/logo-dark.png" alt="Ploeggenoten">
    </div>
    <div class="navscroll" id="navscroll"></div>
    <div class="navfoot">
      <div class="avatar" id="whoava">?</div>
      <div class="who"><b id="whoname">—</b><span id="whorol"></span></div>
      <button class="out" id="logoutbtn" title="Uitloggen">⏻</button>
    </div>
  </nav>

  <main class="content">
    <header class="pagehead" id="pagehead"></header>
    <div class="view" id="viewmount"></div>
  </main>
</div>

<div id="toast"></div>

<!-- Core eerst: definieert het CRM-object waar modules zich bij melden. -->
<script src="js/core.js?v=20260804e"></script>
<!-- Gedeelde rekenlogica die meerdere modules gebruiken. -->
<script src="js/data.js?v=20260804e"></script>
<!-- Outlook-koppeling per gebruiker (Microsoft Graph + deeplink-terugval) -->
<script src="js/outlook.js?v=20260804e"></script>
<!-- Demo-testdata: doet alleen iets op localhost met ?demo=1 -->
<script src="js/demo.js?v=20260804e"></script>
<!-- Rekenregels voor de fee: leidt uit de klantafspraak en de
     salariscomponenten van de kandidaat de grondslag en de fee af.
     Moet vóór de modules staan die hem gebruiken. -->
<script src="js/fee.js?v=20260804e"></script>
<!-- Opvolging: wanneer er contact hoort te zijn (nazorg, warm houden,
     verjaardagen, felicitatiemail, herinnering vóór een afspraak). Eén plek,
     zodat dashboard, bord, kaart en Performance nooit iets anders zeggen. -->
<script src="js/opvolging.js?v=20260804e"></script>
<!-- Feest: confetti en een bericht op elk scherm zodra er getekend wordt.
     Hangt aan document.body, buiten #viewmount, zodat het een
     modulewissel overleeft. -->
<script src="js/feest.js?v=20260804e"></script>
<!-- Kandidaat verwijderen of anonimiseren. Bibliotheek zonder eigen scherm:
     de kandidatenkaart hangt de knoppen onderaan. Leest CRM.PLACED bij het
     laden, dus moet ná js/data.js staan. -->
<script src="js/kandverwijder.js?v=20260804e"></script>
<!-- Trajectpoort: voorkomt dat een tweede voorstel het eerste traject
     stilzwijgend overschrijft, en bewaart wat er wordt afgesloten. -->
<script src="js/traject.js?v=20260804e"></script>
<!-- Documentgeneratoren. Geen menu-item: ze worden geopend vanaf een
     kandidaat- of klantenkaart, dus ze moeten wel vóór die modules laden. -->
<!-- CV inlezen: tekstlaag uit pdf/docx halen, velden voorstellen naast
     wat er al staat, en het bestand zelf bewaren bij de kandidaat. -->
<script src="js/cvparse.js?v=20260804e"></script>
<!-- Video-intake: transcript inlezen, opdracht voor Claude op het klembord,
     antwoord terug en de intakevelden als voorstel invullen. -->
<script src="js/intake.js?v=20260804e"></script>
<!-- CV door Claude laten lezen: voor cv-opmaak die met regels niet te
     vangen is. Zelfde werkwijze als de video-intake — klembord heen,
     klembord terug, geen API en geen kosten. Moet ná cvparse.js staan:
     het hergebruikt diens leesBestand en controlevenster. -->
<script src="js/cvclaude.js?v=20260804e"></script>
<script src="js/cv.js?v=20260804e"></script>
<script src="js/swo.js?v=20260804e"></script>
<script src="js/pva.js?v=20260804e"></script>

<script src="js/contactkaart.js?v=20260804e"></script>
<script src="js/recruitment.js?v=20260804e"></script>
<script src="js/pijplijn.js?v=20260804e"></script>

<script src="js/plaatsingen.js?v=20260804e"></script>

</html>
